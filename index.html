<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LiveWall Assets</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111318;
        color: #f5f7fb;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #aeb6c6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 14px;
      }

      a {
        display: block;
        color: inherit;
        text-decoration: none;
      }

      img {
        width: 100%;
        aspect-ratio: 9 / 16;
        object-fit: cover;
        border-radius: 8px;
        background: #242833;
      }

      span {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: #cbd2df;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LiveWall Assets</h1>
      <p>Static image hosting for the LiveWall app.</p>
      <div class="grid">
        <a href="wallpapers/full/aurora-glow.png"><img src="wallpapers/thumbs/aurora-glow-thumb.png" alt="Aurora Glow"><span>Aurora Glow</span></a>
        <a href="wallpapers/full/blue-gold-flow.png"><img src="wallpapers/thumbs/blue-gold-flow-thumb.png" alt="Blue Gold Flow"><span>Blue Gold Flow</span></a>
        <a href="wallpapers/full/city-rain.png"><img src="wallpapers/thumbs/city-rain-thumb.png" alt="City Rain"><span>City Rain</span></a>
        <a href="wallpapers/full/desert-sun.png"><img src="wallpapers/thumbs/desert-sun-thumb.png" alt="Desert Sun"><span>Desert Sun</span></a>
        <a href="wallpapers/full/forest-mist.png"><img src="wallpapers/thumbs/forest-mist-thumb.png" alt="Forest Mist"><span>Forest Mist</span></a>
        <a href="wallpapers/full/golden-clouds.png"><img src="wallpapers/thumbs/golden-clouds-thumb.png" alt="Golden Clouds"><span>Golden Clouds</span></a>
        <a href="wallpapers/full/neon-lines.png"><img src="wallpapers/thumbs/neon-lines-thumb.png" alt="Neon Lines"><span>Neon Lines</span></a>
        <a href="wallpapers/full/ocean-dawn.png"><img src="wallpapers/thumbs/ocean-dawn-thumb.png" alt="Ocean Dawn"><span>Ocean Dawn</span></a>
        <a href="wallpapers/full/snow-peak.png"><img src="wallpapers/thumbs/snow-peak-thumb.png" alt="Snow Peak"><span>Snow Peak</span></a>
      </div>
    </main>
  </body>
</html>
